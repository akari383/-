<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <title>윤재하</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7d8592"/>
      <stop offset="0.35" stop-color="#b9c0ca"/>
      <stop offset="0.5" stop-color="#cfd5dd"/>
      <stop offset="0.65" stop-color="#b3bac5"/>
      <stop offset="1" stop-color="#737b88"/>
    </linearGradient>
    <pattern id="brush" width="6" height="1000" patternUnits="userSpaceOnUse">
      <rect width="6" height="1000" fill="none"/>
      <rect x="0" width="1" height="1000" fill="#ffffff" opacity="0.10"/>
      <rect x="3" width="1" height="1000" fill="#000000" opacity="0.05"/>
    </pattern>
    <radialGradient id="light" cx="0.5" cy="0.05" r="0.8">
      <stop offset="0" stop-color="#fff6e4" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff6e4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0.6" stop-color="#1b2230" stop-opacity="0"/>
      <stop offset="1" stop-color="#1b2230" stop-opacity="0.45"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9b8a6"/>
      <stop offset="0.12" stop-color="#f0d6c7"/>
      <stop offset="1" stop-color="#ebcdbd"/>
    </linearGradient>
    <linearGradient id="neck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8968a"/>
      <stop offset="0.45" stop-color="#e3c3b2"/>
      <stop offset="1" stop-color="#d9b6a4"/>
    </linearGradient>
    <linearGradient id="hood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9aa0a9"/>
      <stop offset="1" stop-color="#6f757f"/>
    </linearGradient>
    <linearGradient id="hoodShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0.28"/>
      <stop offset="0.3" stop-color="#000" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.32"/>
    </linearGradient>
    <linearGradient id="beanie" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#121317"/>
      <stop offset="0.45" stop-color="#2a2b31"/>
      <stop offset="1" stop-color="#0e0f12"/>
    </linearGradient>
    <linearGradient id="mask" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d0e11"/>
      <stop offset="0.45" stop-color="#26272d"/>
      <stop offset="1" stop-color="#0b0c0f"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16161b"/>
      <stop offset="1" stop-color="#0c0c10"/>
    </linearGradient>
    <clipPath id="eyeL"><path d="M328 452 Q350 433 380 445 Q358 461 328 452 Z"/></clipPath>
    <clipPath id="eyeR"><path d="M420 445 Q450 433 472 452 Q442 461 420 445 Z"/></clipPath>
    <clipPath id="cuffClip"><path d="M276 360 Q400 344 524 360 L526 414 Q400 400 274 414 Z"/></clipPath>
